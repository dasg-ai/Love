<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Calculator</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-storage-compat.js"></script>
    
    <style>
        /* Pehle wala CSS base rahega */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: #000; color: #fff; height: 100vh; overflow: hidden; }
        
        .header { display: flex; justify-content: space-between; padding: 10px 20px; align-items: center; height: 60px; position: fixed; top: 0; width: 100%; z-index: 10; }
        .status { font-size: 13px; font-weight: 500; color: #ff3b30; }
        .bell-icon { font-size: 22px; cursor: pointer; filter: grayscale(1); }

        #calc-screen { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px 20px 50px 20px; }
        .display { font-size: 90px; text-align: right; margin-bottom: 15px; font-weight: 300; letter-spacing: -2px; }
        .btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        button { aspect-ratio: 1/1; border-radius: 50%; border: none; font-size: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        button:active { filter: brightness(1.4); }
        .gray { background: #a5a5a5; color: #000; }
        .dark { background: #333; color: #fff; }
        .orange { background: #ff9f0a; color: #fff; font-size: 40px; }
        .zero { grid-column: span 2; aspect-ratio: 2/1; border-radius: 50px; justify-content: flex-start; padding-left: 32px; }

        #secret-app { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; flex-direction: column; padding-top: env(safe-area-inset-top); }
        .tabs { display: flex; background: #1a1a1a; height: 55px; border-bottom: 1px solid #333; }
        .tab { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; }
        .tab.active { color: #ff9f0a; border-bottom: 2px solid #ff9f0a; }

        #chat-flow { flex: 1; background: #f2f2f7; border-radius: 20px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; color: #000; margin: 10px; }
        .m { padding: 10px 15px; border-radius: 18px; max-width: 80%; font-size: 16px; line-height: 1.4; position: relative; }
        .me { background: #34c759; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .him { background: #e5e5ea; align-self: flex-start; border-bottom-left-radius: 4px; }
        
        /* IMAGE STYLE IN CHAT */
        .chat-img { max-width: 100%; border-radius: 12px; margin-top: 5px; display: block; }

        .chat-input { display: flex; gap: 8px; padding: 15px; align-items: center; background: #000; }
        .chat-input input { flex: 1; background: #1c1c1e; border: none; border-radius: 25px; padding: 12px 20px; color: #fff; font-size: 16px; }
        
        .attach-btn { color: #ff9f0a; font-size: 24px; cursor: pointer; padding: 0 5px; }
        #file-input { display: none; }

        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
    </style>
</head>
<body>

    <div class="header">
        <div id="dot" class="status">● Offline</div>
        <div class="bell-icon" onclick="triggerBell()">🔔</div>
    </div>

    <div id="calc-screen">
        <div class="display" id="scr">0</div>
        <div class="btns">
            <button class="gray" onclick="cls()">AC</button><button class="gray">+/-</button><button class="gray">%</button><button class="orange" onclick="op('/')">÷</button>
            <button class="dark" onclick="num('7')">7</button><button class="dark" onclick="num('8')">8</button><button class="dark" onclick="num('9')">9</button><button class="orange" onclick="op('*')">×</button>
            <button class="dark" onclick="num('4')">4</button><button class="dark" onclick="num('5')">5</button><button class="dark" onclick="num('6')">6</button><button class="orange" onclick="op('-')">−</button>
            <button class="dark" onclick="num('1')">1</button><button class="dark" onclick="num('2')">2</button><button class="dark" onclick="num('3')">3</button><button class="orange" onclick="op('+')">+</button>
            <button class="dark zero" onclick="num('0')">0</button><button class="dark">.</button><button class="orange" onclick="run()">=</button>
        </div>
    </div>

    <div id="overlay">
        <div style="width: 80%; text-align: center;">
            <h2 style="margin-bottom:20px">Private Access</h2>
            <input type="password" id="p" style="background:#1c1c1e; border:1px solid #333; color:#fff; width:100%; padding:15px; border-radius:12px; font-size:18px; text-align:center;" placeholder="Enter PIN">
            <button onclick="unlock()" style="background:#ff9f0a; color:#fff; width:100%; padding:15px; border-radius:12px; font-weight:bold; border:none; margin-top:20px;">Open</button>
        </div>
    </div>

    <div id="secret-app">
        <div class="tabs">
            <div class="tab active">Messages</div>
            <div class="tab">Live</div>
        </div>
        
        <div id="chat-flow"></div>

        <div class="chat-input">
            <label for="file-input" class="attach-btn">📎</label>
            <input type="file" id="file-input" accept="image/*" onchange="sendPhoto(this)">
            
            <input type="text" id="m-in" placeholder="Write message...">
            <button onclick="sendMsg()" style="background:#ff9f0a; border:none; border-radius:50%; width:40px; height:40px; color:#fff; font-weight:bold;">↑</button>
        </div>
    </div>

    <script>
        let cur = "";
        function num(n) { cur += n; update(); }
        function op(o) { cur += o; update(); }
        function cls() { cur = ""; update("0"); }
        function update(v) { document.getElementById('scr').innerText = v || cur; }

        function run() {
            if(cur === "1432") { document.getElementById('overlay').style.display = 'flex'; return; }
            try { let res = eval(cur); cur = res.toString(); update(); } catch { cls(); }
        }

        function unlock() {
            if(document.getElementById('p').value === "jaan") {
                document.getElementById('overlay').style.display = 'none';
                document.getElementById('secret-app').style.display = 'flex';
            } else { alert("Wrong!"); }
        }

        function pushMessage(content, type, isImage = false) {
            const flow = document.getElementById('chat-flow');
            const div = document.createElement('div');
            div.className = `m ${type}`;
            
            if(isImage) {
                const img = document.createElement('img');
                img.src = content;
                img.className = 'chat-img';
                div.appendChild(img);
            } else {
                div.innerText = content;
            }
            
            flow.appendChild(div);
            flow.scrollTop = flow.scrollHeight;
        }

        function sendMsg() {
            const inp = document.getElementById('m-in');
            if(inp.value.trim()) {
                pushMessage(inp.value, 'me');
                inp.value = "";
                // Firebase logic will go here
            }
        }

        function sendPhoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    pushMessage(e.target.result, 'me', true);
                    // Firebase storage upload will go here
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        document.body.addEventListener('dblclick', () => {
            document.getElementById('secret-app').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        });
    </script>
</body>
</html>
