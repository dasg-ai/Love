<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Online Club</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #121212; color: white; overflow: hidden; }
        
        /* Navbar */
        .nav { background: #1f1f1f; display: flex; justify-content: space-around; padding: 12px 0; border-bottom: 2px solid #2ecc71; }
        .nav-link { cursor: pointer; color: #aaa; font-weight: bold; font-size: 13px; text-transform: uppercase; }
        .nav-link.active { color: #2ecc71; border-bottom: 2px solid #2ecc71; }

        /* Screens */
        .page { display: none; height: calc(100vh - 50px); width: 100%; position: relative; text-align: center; }
        .show { display: block; }

        /* Ludo Screen */
        #ludo-page { background: #1e8449; padding-top: 50px; }
        .board { width: 280px; height: 280px; margin: auto; background: white; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; border: 5px solid #2c3e50; }
        .dice { margin-top: 30px; padding: 15px 40px; background: #f39c12; border: none; border-radius: 50px; color: white; font-size: 18px; font-weight: bold; cursor: pointer; }

        /* Live/Video Screen */
        #live-page { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #remoteVideo { width: 100%; height: 80%; background: #000; object-fit: cover; }
        .setup-box { position: absolute; top: 20%; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; backdrop-filter: blur(10px); }
        
        /* Chat/News */
        #news-page { background: #f4f4f4; color: #333; padding: 20px; }
        #chat-logs { height: 60%; background: white; border: 1px solid #ddd; margin-bottom: 10px; overflow-y: auto; text-align: left; padding: 10px; }
        
        input { padding: 10px; border-radius: 5px; border: 1px solid #ccc; width: 70%; }
        .btn { padding: 10px 20px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <nav class="nav">
        <div class="nav-link active" onclick="nav('ludo-page')">Ludo Game</div>
        <div class="nav-link" onclick="nav('news-page')">News</div>
        <div class="nav-link" onclick="nav('live-page')">Live</div>
    </nav>

    <!-- SCREEN 1: LUDO -->
    <div id="ludo-page" class="page show">
        <div class="board">
            <div style="background:red"></div><div style="background:blue"></div>
            <div style="background:green"></div><div style="background:yellow"></div>
        </div>
        <button class="dice" onclick="roll()">🎲 Roll Dice</button>
        <h2 id="res">0</h2>
    </div>

    <!-- SCREEN 2: NEWS (CHAT) -->
    <div id="news-page" class="page">
        <div id="chat-logs"></div>
        <input type="text" id="m-in" placeholder="Type secret...">
        <button class="btn" onclick="sendMsg()">Send</button>
    </div>

    <!-- SCREEN 3: LIVE (ID SYSTEM) -->
    <div id="live-page" class="page">
        <div id="id-input-area" class="setup-box">
            <h4>Security Check</h4>
            <input type="text" id="partner-id" placeholder="Enter Connection ID">
            <button class="btn" onclick="connectToPartner()" style="margin-top:10px;">Connect Live</button>
        </div>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <script>
        let peer = new Peer(); // Auto-generated ID for her
        let conn;
        let myStream;

        // Navigation
        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('show'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(id).classList.add('show');
            event.target.classList.add('active');
        }

        // Dice Logic
        function roll() {
            document.getElementById('res').innerText = Math.floor(Math.random() * 6) + 1;
        }

        // Live Connection Logic
        async function connectToPartner() {
            const targetId = document.getElementById('partner-id').value;
            if(!targetId) return alert("ID likho pehle");

            try {
                // Camera Permission
                myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                
                // Hide ID input area after clicking
                document.getElementById('id-input-area').style.display = 'none';

                // Call the ID (Your ID: amit-123)
                const call = peer.call(targetId, myStream);
                
                // Chat Connection
                conn = peer.connect(targetId);
                setupChat();

                // If you send your video, it shows here
                call.on('stream', rStream => {
                    document.getElementById('remoteVideo').srcObject = rStream;
                });

            } catch (e) {
                alert("Camera Access Denied!");
            }
        }

        function setupChat() {
            conn.on('data', data => {
                document.getElementById('chat-logs').innerHTML += `<p style="color:blue"><b>Partner:</b> ${data}</p>`;
            });
        }

        function sendMsg() {
            const msg = document.getElementById('m-in').value;
            if(conn && msg) {
                conn.send(msg);
                document.getElementById('chat-logs').innerHTML += `<p><b>Me:</b> ${msg}</p>`;
                document.getElementById('m-in').value = "";
            }
        }

        // Emergency Hide
        document.body.addEventListener('dblclick', () => {
            nav('ludo-page');
        });
    </script>
</body>
</html>
