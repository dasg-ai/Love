<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Calculator</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: #000; color: #fff; height: 100vh; overflow: hidden; }
        
        .header { display: flex; justify-content: space-between; padding: 10px 20px; align-items: center; height: 50px; position: fixed; top: 0; width: 100%; z-index: 10; }
        #status { font-size: 12px; color: #ff3b30; }
        .bell { font-size: 20px; cursor: pointer; color: #555; }

        /* CALCULATOR */
        #calc-ui { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px 20px 40px 20px; }
        .res { font-size: 80px; text-align: right; margin-bottom: 10px; font-weight: 300; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        button { aspect-ratio: 1/1; border-radius: 50%; border: none; font-size: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        button:active { filter: brightness(1.5); }
        .gray { background: #a5a5a5; color: #000; }
        .dark { background: #333; color: #fff; }
        .orange { background: #ff9f0a; color: #fff; }
        .zero { grid-column: span 2; aspect-ratio: 2/1; border-radius: 50px; justify-content: flex-start; padding-left: 30px; }

        /* SECRET AREA */
        #secret-app { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; flex-direction: column; }
        .tabs { display: flex; height: 50px; background: #1a1a1a; border-bottom: 1px solid #333; }
        .tab { flex: 1; text-align: center; line-height: 50px; color: #888; font-size: 12px; font-weight: bold; }
        .tab.active { color: #ff9f0a; border-bottom: 2px solid #ff9f0a; }

        .panel { flex: 1; display: none; flex-direction: column; padding: 15px; }
        .active-p { display: flex; }
        
        #chat-log { flex: 1; background: #f2f2f7; border-radius: 15px; padding: 15px; overflow-y: auto; color: #000; display: flex; flex-direction: column; gap: 8px; }
        .m { padding: 8px 12px; border-radius: 15px; max-width: 75%; font-size: 15px; word-wrap: break-word; }
        .me { background: #34c759; color: #fff; align-self: flex-end; }
        .him { background: #e5e5ea; align-self: flex-start; }
        .chat-img { max-width: 100%; border-radius: 10px; margin-top: 5px; }

        .inp-bar { display: flex; gap: 10px; padding: 10px 0; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #1c1c1e; color: #fff; }
        
        video { width: 100%; height: 350px; border-radius: 15px; background: #111; object-fit: cover; }
        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="header">
        <span id="status">● Offline</span>
        <span class="bell" onclick="ring()">🔔</span>
    </div>

    <div id="calc-ui">
        <div class="res" id="scr">0</div>
        <div class="grid">
            <button class="gray" onclick="cls()">AC</button><button class="gray">+/-</button><button class="gray">%</button><button class="orange" onclick="add('/')">÷</button>
            <button class="dark" onclick="add('7')">7</button><button class="dark" onclick="add('8')">8</button><button class="dark" onclick="add('9')">9</button><button class="orange" onclick="add('*')">×</button>
            <button class="dark" onclick="add('4')">4</button><button class="dark" onclick="add('5')">5</button><button class="dark" onclick="add('6')">6</button><button class="orange" onclick="add('-')">−</button>
            <button class="dark" onclick="add('1')">1</button><button class="dark" onclick="add('2')">2</button><button class="dark" onclick="add('3')">3</button><button class="orange" onclick="add('+')">+</button>
            <button class="dark zero" onclick="add('0')">0</button><button class="dark">.</button><button class="orange" onclick="run()">=</button>
        </div>
    </div>

    <div id="overlay">
        <div style="background:#1c1c1e; padding:30px; border-radius:20px; text-align:center; width:80%;">
            <h3 style="margin-top:0">Password</h3>
            <input type="password" id="pass" placeholder="Enter PIN" style="width:100%; padding:12px; border-radius:10px; border:none; text-align:center;">
            <br><br>
            <button onclick="unlock()" style="background:#ff9f0a; color:white; padding:12px; border:none; border-radius:10px; width:100%; font-weight:bold;">Unlock</button>
        </div>
    </div>

    <div id="secret-app">
        <div class="tabs">
            <div id="t1" class="tab active" onclick="tab('chat-p', 't1')">CHAT</div>
            <div id="t2" class="tab" onclick="tab('live-p', 't2')">LIVE</div>
        </div>

        <div id="chat-p" class="panel active-p">
            <div id="chat-log"></div>
            <div class="inp-bar">
                <label for="img-in" style="font-size:24px; cursor:pointer;">📎</label>
                <input type="file" id="img-in" accept="image/*" style="display:none;" onchange="sendImg(this)">
                <input type="text" id="minp" placeholder="Aa">
                <button onclick="sendMsg()" style="background:#ff9f0a; border:none; padding:10px 15px; border-radius:15px; color:white;">↑</button>
            </div>
        </div>

        <div id="live-p" class="panel">
            <video id="v-rem" autoplay playsinline></video>
            <p style="text-align:center; color:gray; margin-top:10px;">Connecting to 1432...</p>
        </div>
    </div>

    <script>
        let cur = "";
        let peer = new Peer('143'); // Unka ID
        let conn;

        function add(n) { cur += n; document.getElementById('scr').innerText = cur; }
        function cls() { cur = ""; document.getElementById('scr').innerText = "0"; }
        function run() {
            if(cur === "1432") { document.getElementById('overlay').style.display = 'flex'; return; }
            try { let res = eval(cur.replace('×','*').replace('÷','/').replace('−','-')); document.getElementById('scr').innerText = res; cur = res.toString(); } 
            catch { cls(); }
        }

        function unlock() {
            if(document.getElementById('pass').value === "jaan") {
                document.getElementById('overlay').style.display = 'none';
                document.getElementById('secret-app').style.display = 'flex';
                initPeer();
            } else { alert("Ghalat!"); }
        }

        async function initPeer() {
            // Live Connection Setup
            try {
                const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
                const call = peer.call('1432', stream);
                conn = peer.connect('1432');
                
                call.on('stream', rs => { document.getElementById('v-rem').srcObject = rs; });
                
                peer.on('connection', c => {
                    conn = c;
                    conn.on('data', d => handleData(d));
                });

                if(conn) conn.on('data', d => handleData(d));
            } catch (e) { console.log("Camera off"); }
        }

        function handleData(d) {
            if(d.type === "IMG") pushM(d.data, 'him', true);
            else if(d === "RING") { if(navigator.vibrate) navigator.vibrate([200,100,200]); }
            else pushM(d, 'him');
        }

        function sendMsg() {
            let m = document.getElementById('minp').value;
            if(m && conn) { conn.send(m); pushM(m, 'me'); document.getElementById('minp').value = ""; }
        }

        function sendImg(input) {
            if (input.files && input.files[0] && conn) {
                const reader = new FileReader();
                reader.onload = e => {
                    conn.send({type: "IMG", data: e.target.result});
                    pushM(e.target.result, 'me', true);
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function pushM(t, cl, isImg) {
            let l = document.getElementById('chat-log');
            if(isImg) l.innerHTML += `<div class="m ${cl}"><img src="${t}" class="chat-img"></div>`;
            else l.innerHTML += `<div class="m ${cl}">${t}</div>`;
            l.scrollTop = l.scrollHeight;
        }

        function tab(sid, tid) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active-p'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(sid).classList.add('active-p');
            document.getElementById(tid).classList.add('active');
        }

        function ring() { if(conn) conn.send("RING"); }

        document.body.addEventListener('dblclick', () => {
            document.getElementById('secret-app').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        });
    </script>
</body>
</html>
