<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Calculator</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #000; color: white; overflow: hidden; }
        
        /* CALCULATOR DESIGN */
        #calc-screen { height: 100vh; width: 100vw; background: #000; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 20px; }
        .display { padding: 40px 20px; font-size: 60px; text-align: right; color: #fff; overflow: hidden; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px; }
        .btn { height: 70px; border-radius: 50%; border: none; font-size: 24px; font-weight: bold; cursor: pointer; }
        .num { background: #333; color: white; }
        .op { background: #f39c12; color: white; }
        .special { background: #a5a5a5; color: black; }

        /* PRIVATE APP AREA */
        #private-app { display: none; height: 100vh; width: 100vw; background: #121212; position: fixed; top: 0; z-index: 100; }
        .tabs { display: flex; justify-content: space-around; background: #1f1f1f; padding: 15px 0; border-bottom: 1px solid #333; }
        .tab-btn { color: #888; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 13px; }
        .tab-btn.active { color: #f39c12; }

        .content { height: calc(100vh - 50px); display: none; padding: 10px; }
        .active-content { display: block; }

        /* Chat Styles */
        #chat-win { height: 70%; overflow-y: auto; background: #fff; color: #000; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .m { padding: 8px 12px; border-radius: 15px; max-width: 75%; font-size: 14px; }
        .me { background: #dcf8c6; align-self: flex-end; }
        .him { background: #eee; align-self: flex-start; }

        /* Video Styles */
        video { width: 100%; height: 70%; background: #000; object-fit: cover; border-radius: 10px; }
        input { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #222; color: white; width: 80%; }
    </style>
</head>
<body>

    <div id="calc-screen">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="btn special" onclick="clearCalc()">AC</button>
            <button class="btn special">+/-</button>
            <button class="btn special">%</button>
            <button class="btn op">/</button>
            <button class="btn num" onclick="press('7')">7</button>
            <button class="btn num" onclick="press('8')">8</button>
            <button class="btn num" onclick="press('9')">9</button>
            <button class="btn op">*</button>
            <button class="btn num" onclick="press('4')">4</button>
            <button class="btn num" onclick="press('5')">5</button>
            <button class="btn num" onclick="press('6')">6</button>
            <button class="btn op">-</button>
            <button class="btn num" onclick="press('1')">1</button>
            <button class="btn num" onclick="press('2')">2</button>
            <button class="btn num" onclick="press('3')">3</button>
            <button class="btn op">+</button>
            <button class="btn num" style="grid-column: span 2; border-radius: 40px;" onclick="press('0')">0</button>
            <button class="btn num">.</button>
            <button class="btn op" onclick="calculate()">=</button>
        </div>
    </div>

    <div id="private-app">
        <div class="tabs">
            <div class="tab-btn active" onclick="showTab('chat-sec', this)">Chat (News)</div>
            <div class="tab-btn" onclick="showTab('live-sec', this)">Live</div>
        </div>

        <div id="chat-sec" class="content active-content">
            <div id="chat-win"></div>
            <div style="margin-top:10px; display:flex; gap:5px;">
                <input type="text" id="msg-input" placeholder="Secret msg...">
                <button onclick="sendMsg()" style="background:#27ae60; color:white; border:none; padding:10px; border-radius:8px;">Send</button>
            </div>
        </div>

        <div id="live-sec" class="content">
            <div id="setup-box">
                <input type="text" id="target-id" placeholder="Partner ID (amit-123)">
                <button onclick="startVideo()" style="background:#f39c12; color:white; border:none; padding:10px; margin-top:10px; width:100%; border-radius:8px;">Connect Live</button>
            </div>
            <video id="v-feed" autoplay playsinline></video>
        </div>
    </div>

    <script>
        let currentInput = "";
        const SECRET_CODE = "1234"; // AAPKA SECRET PASSWORD
        let myPeer = new Peer();
        let connection;

        // CALCULATOR LOGIC
        function press(num) {
            currentInput += num;
            document.getElementById('display').innerText = currentInput;
        }

        function clearCalc() {
            currentInput = "";
            document.getElementById('display').innerText = "0";
        }

        function calculate() {
            // Check if secret code is entered
            if(currentInput === SECRET_CODE) {
                document.getElementById('private-app').style.display = 'block';
                clearCalc();
                return;
            }
            try {
                let res = eval(currentInput);
                document.getElementById('display').innerText = res;
                currentInput = res.toString();
            } catch {
                document.getElementById('display').innerText = "Error";
                currentInput = "";
            }
        }

        // NAVIGATION
        function showTab(id, el) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active-content'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active-content');
            el.classList.add('active');
        }

        // LIVE & CHAT LOGIC
        async function startVideo() {
            const tid = document.getElementById('target-id').value;
            if(!tid) return;
            const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
            document.getElementById('setup-box').style.display = 'none';
            
            const call = myPeer.call(tid, stream);
            connection = myPeer.connect(tid);
            
            call.on('stream', rs => { document.getElementById('v-feed').srcObject = rs; });
            connection.on('data', d => { addChat(d, 'him'); });
        }

        function sendMsg() {
            const m = document.getElementById('msg-input').value;
            if(connection && m) {
                connection.send(m);
                addChat(m, 'me');
                document.getElementById('msg-input').value = "";
            } else { alert("Pehle LIVE par connect karein!"); }
        }

        function addChat(t, type) {
            const win = document.getElementById('chat-win');
            win.innerHTML += `<div class="m ${type}">${t}</div>`;
            win.scrollTop = win.scrollHeight;
        }

        // EMERGENCY HIDE (Double Click)
        document.body.addEventListener('dblclick', () => {
            document.getElementById('private-app').style.display = 'none';
        });

    </script>
</body>
</html>
