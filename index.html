<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Gold Premium</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #27ae60; --secondary: #2c3e50; --accent: #f1c40f; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #1a1a1d; color: white; overflow: hidden; }

        /* Login Popup */
        #login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .login-card { background: #2c3e50; padding: 30px; border-radius: 20px; text-align: center; width: 85%; max-width: 350px; border: 2px solid var(--accent); }
        .login-card h2 { color: var(--accent); margin-bottom: 20px; }
        
        /* Navbar */
        .navbar { background: #0f0f12; display: flex; justify-content: space-around; padding: 15px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .nav-item { cursor: pointer; color: #777; font-weight: bold; font-size: 12px; transition: 0.3s; text-transform: uppercase; }
        .nav-item.active { color: var(--accent); transform: scale(1.1); }

        /* Screens */
        .page { display: none; height: calc(100vh - 60px); width: 100%; position: relative; overflow: auto; }
        .active { display: block; }

        /* Professional Ludo Board */
        #ludo-page { background: radial-gradient(#27ae60, #145a32); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .board { width: 320px; height: 320px; background: #fff; display: grid; grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(15, 1fr); border: 8px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        /* Home Boxes */
        .home { grid-column: span 6; grid-row: span 6; border: 1px solid #000; }
        .red { background: #ff3f34; } .blue { background: #1e90ff; } .green { background: #05c46b; } .yellow { background: #ffdd59; }
        .center { grid-column: 7 / 10; grid-row: 7 / 10; background: #333; }

        /* Controls */
        input { padding: 12px; border-radius: 8px; border: none; width: 80%; margin: 10px 0; background: #3d3d42; color: white; outline: none; }
        .btn-prime { padding: 12px 25px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Video Area */
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #000; }
        .id-panel { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 20px; border-radius: 15px; width: 80%; }
    </style>
</head>
<body>

    <!-- POPUP LOGIN -->
    <div id="login-overlay">
        <div class="login-card">
            <h2>LUDO GOLD</h2>
            <p>Enter Private PIN to Play</p>
            <input type="password" id="main-pass" placeholder="****">
            <br><br>
            <button class="btn-prime" onclick="verifyLogin()">ENTER GAME</button>
        </div>
    </div>

    <!-- NAVIGATION -->
    <nav class="navbar">
        <div class="nav-item active" onclick="switchTab(this, 'ludo-page')">Ludo</div>
        <div class="nav-item" onclick="switchTab(this, 'news-page')">News</div>
        <div class="nav-item" onclick="switchTab(this, 'live-page')">Live</div>
    </nav>

    <!-- PAGE: LUDO -->
    <div id="ludo-page" class="page active">
        <div class="board">
            <div class="home red"></div><div style="grid-column: span 3; grid-row: span 6;"></div><div class="home blue"></div>
            <div style="grid-column: span 6; grid-row: span 3;"></div><div class="center"></div><div style="grid-column: span 6; grid-row: span 3;"></div>
            <div class="home green"></div><div style="grid-column: span 3; grid-row: span 6;"></div><div class="home yellow"></div>
        </div>
        <div style="margin-top:20px;">
            <button class="btn-prime" onclick="playDice()" style="background:#e67e22">🎲 ROLL DICE</button>
            <h1 id="dice-val">--</h1>
        </div>
    </div>

    <!-- PAGE: NEWS (CHAT) -->
    <div id="news-page" class="page" style="background:#f9f9f9; color:#333; padding:20px;">
        <div id="chat-box" style="height:70%; background:white; border:1px solid #ddd; overflow-y:auto; padding:10px; border-radius:10px; margin-bottom:10px;">
            <p style="color:gray; font-size:12px;">Welcome to News Portal. No updates today.</p>
        </div>
        <input type="text" id="chat-msg" placeholder="Type here..." style="background:#eee; color:#000;">
        <button class="btn-prime" onclick="doChat()">SEND</button>
    </div>

    <!-- PAGE: LIVE -->
    <div id="live-page" class="page">
        <div id="setup-live" class="id-panel">
            <h3>Secure Channel</h3>
            <input type="text" id="target-id" placeholder="Enter Partner ID">
            <button class="btn-prime" onclick="startLive()">GO LIVE</button>
        </div>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <script>
        const SECRET = "1234"; // AAPKA PASSWORD
        let peer = new Peer();
        let conn;

        function verifyLogin() {
            const p = document.getElementById('main-pass').value;
            if(p === SECRET) {
                document.getElementById('login-overlay').style.display = 'none';
            } else {
                alert("Incorrect PIN!");
            }
        }

        function switchTab(el, pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            el.classList.add('active');
        }

        function playDice() {
            document.getElementById('dice-val').innerText = Math.floor(Math.random() * 6) + 1;
        }

        async function startLive() {
            const tid = document.getElementById('target-id').value;
            if(!tid) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('setup-live').style.display = 'none';
                
                const call = peer.call(tid, stream);
                conn = peer.connect(tid);

                conn.on('data', d => {
                    document.getElementById('chat-box').innerHTML += `<p><b>Partner:</b> ${d}</p>`;
                });

                call.on('stream', rs => {
                    document.getElementById('remoteVideo').srcObject = rs;
                });
            } catch(e) { alert("Camera Permission Required!"); }
        }

        function doChat() {
            const m = document.getElementById('chat-msg').value;
            if(conn && m) {
                conn.send(m);
                document.getElementById('chat-box').innerHTML += `<p><b>Me:</b> ${m}</p>`;
                document.getElementById('chat-msg').value = "";
            }
        }

        // 2-Clicks Emergency Return to Ludo
        document.body.addEventListener('dblclick', () => {
            switchTab(document.querySelector('.nav-item'), 'ludo-page');
        });
    </script>
</body>
</html>
