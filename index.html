<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Gold Premium</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #27ae60; --secondary: #2c3e50; --accent: #f1c40f; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #1a1a1d; color: white; overflow: hidden; }

        /* Login Popups */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .card { background: #2c3e50; padding: 30px; border-radius: 20px; text-align: center; width: 85%; max-width: 350px; border: 2px solid var(--accent); }
        
        /* Navbar */
        .navbar { background: #0f0f12; display: flex; justify-content: space-around; padding: 15px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .nav-item { cursor: pointer; color: #777; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        .nav-item.active { color: var(--accent); }

        /* Screens */
        .page { display: none; height: calc(100vh - 60px); width: 100%; position: relative; }
        .active { display: block; }

        /* Ludo Board */
        #ludo-page { background: radial-gradient(#27ae60, #145a32); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .board { width: 300px; height: 300px; background: #fff; display: grid; grid-template-columns: repeat(3, 1fr); border: 5px solid #333; }
        .box { border: 1px solid #000; height: 100px; }

        /* Inputs & Buttons */
        input { padding: 12px; border-radius: 8px; border: none; width: 80%; margin: 10px 0; background: #3d3d42; color: white; }
        .btn-prime { padding: 12px 25px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="main-login" class="overlay">
        <div class="card">
            <h2>LUDO GOLD</h2>
            <p>System Security Check</p>
            <input type="password" id="entry-pass" placeholder="Enter PIN">
            <br><br>
            <button class="btn-prime" onclick="checkEntry()">ENTER GAME</button>
        </div>
    </div>

    <div id="news-login" class="overlay" style="display: none;">
        <div class="card">
            <h2 style="color:#ed1c24">NEWS PORTAL</h2>
            <p>Admin Password Required</p>
            <input type="password" id="news-pass" placeholder="Password">
            <br><br>
            <button class="btn-prime" onclick="checkNewsPass()">UNLOCK NEWS</button>
            <p onclick="switchTab('ludo-page')" style="font-size:12px; margin-top:10px; cursor:pointer;">Cancel</p>
        </div>
    </div>

    <nav class="navbar">
        <div id="nav-ludo" class="nav-item active" onclick="switchTab('ludo-page')">Ludo</div>
        <div id="nav-news" class="nav-item" onclick="handleNewsClick()">News</div>
        <div id="nav-live" class="nav-item" onclick="switchTab('live-page')">Live</div>
    </nav>

    <div id="ludo-page" class="page active">
        <div class="board">
            <div class="box" style="background:red"></div><div class="box"></div><div class="box" style="background:blue"></div>
            <div class="box"></div><div class="box" style="background:yellow"></div><div class="box"></div>
            <div class="box" style="background:green"></div><div class="box"></div><div class="box" style="background:red"></div>
        </div>
        <button class="btn-prime" style="margin-top:20px;">🎲 ROLL DICE</button>
    </div>

    <div id="news-page" class="page" style="background:#fff; color:#333; padding:20px;">
        <div id="chat-box" style="height:70%; border:1px solid #ddd; overflow-y:auto; padding:10px; margin-bottom:10px;">
            <b>System:</b> Connected to secure news line.
        </div>
        <input type="text" id="chat-msg" placeholder="Message..." style="background:#eee; color:#000; width:70%">
        <button class="btn-prime" onclick="sendChat()">SEND</button>
    </div>

    <div id="live-page" class="page">
        <div style="padding:20px; text-align:center;">
            <h3>Live Feed</h3>
            <input type="text" id="partner-id" placeholder="Partner ID">
            <button class="btn-prime" onclick="startLive()">CONNECT</button>
        </div>
        <video id="remoteVideo" autoplay playsinline style="width:100%; height:70%; background:#000;"></video>
    </div>

    <script>
        let peer = new Peer();
        let conn;

        // Entry Login
        function checkEntry() {
            if(document.getElementById('entry-pass').value === "1234") {
                document.getElementById('main-login').style.display = 'none';
            } else { alert("Wrong PIN"); }
        }

        // News Click Logic
        function handleNewsClick() {
            document.getElementById('news-login').style.display = 'flex';
        }

        // News Password Check
        function checkNewsPass() {
            if(document.getElementById('news-pass').value === "jaan") {
                document.getElementById('news-login').style.display = 'none';
                switchTab('news-page');
            } else {
                alert("Incorrect News Password!");
            }
        }

        function switchTab(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            
            // Highlight nav
            if(pageId === 'ludo-page') document.getElementById('nav-ludo').classList.add('active');
            if(pageId === 'news-page') document.getElementById('nav-news').classList.add('active');
            if(pageId === 'live-page') document.getElementById('nav-live').classList.add('active');

            if(pageId !== 'news-page') {
                document.getElementById('news-login').style.display = 'none';
            }
        }

        async function startLive() {
            const tid = document.getElementById('partner-id').value;
            const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
            const call = peer.call(tid, stream);
            conn = peer.connect(tid);
            call.on('stream', rs => { document.getElementById('remoteVideo').srcObject = rs; });
            conn.on('data', d => { document.getElementById('chat-box').innerHTML += `<p><b>Him:</b> ${d}</p>`; });
        }

        function sendChat() {
            const m = document.getElementById('chat-msg').value;
            if(conn && m) {
                conn.send(m);
                document.getElementById('chat-box').innerHTML += `<p><b>Me:</b> ${m}</p>`;
                document.getElementById('chat-msg').value = "";
            }
        }

        // Double click to hide everything and go to Ludo
        document.body.addEventListener('dblclick', () => switchTab('ludo-page'));
    </script>
</body>
</html>
