<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Gold Premium</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --red: #ff3f34; --blue: #1e90ff; --green: #05c46b; --yellow: #ffdd59; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #121212; color: white; overflow: hidden; }

        /* Navigation */
        .navbar { height: 60px; background: #1f1f1f; display: flex; justify-content: space-around; align-items: center; border-bottom: 2px solid #333; position: fixed; bottom: 0; width: 100%; z-index: 100; }
        .nav-item { cursor: pointer; color: #888; font-size: 12px; text-align: center; font-weight: bold; }
        .nav-item.active { color: #f1c40f; }

        /* Screen Container */
        .page { height: calc(100vh - 60px); width: 100vw; display: none; overflow: hidden; position: absolute; top: 0; }
        .active-page { display: block; }

        /* Ludo Board Professional Design */
        #ludo-page { background: #27ae60; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .ludo-container { width: 320px; height: 320px; background: #fff; display: grid; grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(15, 1fr); border: 4px solid #333; }
        .home { grid-column: span 6; grid-row: span 6; border: 1px solid #333; display: flex; align-items: center; justify-content: center; }
        .inner-box { width: 70%; height: 70%; background: white; border-radius: 10px; border: 2px solid #333; }
        .path { border: 0.1px solid #ddd; }
        
        /* Chat/News Page */
        #news-page { background: #f0f2f5; color: #333; display: flex; flex-direction: column; }
        #chat-header { background: #ed1c24; color: white; padding: 15px; font-weight: bold; }
        #chat-content { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        .msg { margin-bottom: 10px; padding: 10px; border-radius: 10px; max-width: 80%; }
        .msg.me { background: #dcf8c6; align-self: flex-end; }
        .msg.him { background: #fff; align-self: flex-start; border: 1px solid #ddd; }
        .chat-input { padding: 15px; background: white; display: flex; gap: 10px; border-top: 1px solid #ddd; }

        /* Overlays */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        input[type="password"], input[type="text"] { padding: 12px; width: 250px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="main-lock" class="overlay">
        <h2 style="color:#f1c40f">LUDO GOLD</h2>
        <input type="password" id="entry-pin" placeholder="Enter Game PIN">
        <button onclick="unlockApp()" style="padding:10px 30px; background:#f1c40f; border:none; border-radius:5px; font-weight:bold;">PLAY</button>
    </div>

    <div id="news-lock" class="overlay" style="display:none;">
        <h2 style="color:#ed1c24">Restricted News</h2>
        <input type="password" id="news-pin" placeholder="Enter Admin Password">
        <button onclick="unlockNews()" style="padding:10px 30px; background:#ed1c24; color:white; border:none; border-radius:5px;">ACCESS</button>
        <p onclick="showPage('ludo-page')" style="margin-top:15px; font-size:12px; cursor:pointer;">← Back to Ludo</p>
    </div>

    <div id="ludo-page" class="page active-page">
        <div class="ludo-container">
            <div class="home" style="background:var(--red);"><div class="inner-box"></div></div>
            <div style="grid-column: span 3; grid-row: span 6; background:#fff; display:grid; grid-template-columns: repeat(3,1fr);">
                <div class="path"></div><div class="path" style="background:var(--blue)"></div><div class="path"></div>
                <div class="path"></div><div class="path" style="background:var(--blue)"></div><div class="path"></div>
                <div class="path"></div><div class="path" style="background:var(--blue)"></div><div class="path"></div>
            </div>
            <div class="home" style="background:var(--blue);"><div class="inner-box"></div></div>
            <div style="grid-column: span 15; grid-row: span 3; background:#eee; display:flex; align-items:center; justify-content:center; font-weight:bold; color:#333;">LUDO CENTER</div>
            <div class="home" style="background:var(--green);"><div class="inner-box"></div></div>
            <div style="grid-column: span 3; grid-row: span 6; background:#fff;"></div>
            <div class="home" style="background:var(--yellow);"><div class="inner-box"></div></div>
        </div>
        <button onclick="alert('Dice: ' + (Math.floor(Math.random()*6)+1))" style="margin-top:30px; padding:15px 40px; border-radius:50px; background:#f39c12; border:none; color:white; font-weight:bold; font-size:20px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">🎲 ROLL DICE</button>
    </div>

    <div id="news-page" class="page">
        <div id="chat-header">Internal News Messenger</div>
        <div id="chat-content">
            <div class="msg him">Welcome to the private server. Type below to sync.</div>
        </div>
        <div class="chat-input">
            <input type="text" id="m-text" placeholder="Write news update..." style="flex:1; margin:0;">
            <button onclick="broadcast()" style="background:#27ae60; color:white; border:none; padding:10px 20px; border-radius:8px;">Send</button>
        </div>
    </div>

    <div id="live-page" class="page" style="background:#000;">
        <div id="live-setup" style="padding:20px; text-align:center;">
            <h3>Live Connection</h3>
            <input type="text" id="target-peer" placeholder="Partner ID (e.g. amit-123)">
            <br>
            <button onclick="startCall()" style="background:#f1c40f; padding:10px 20px; border:none; border-radius:5px;">Connect Live</button>
        </div>
        <video id="v-remote" autoplay playsinline style="width:100%; height:80%; object-fit:cover;"></video>
    </div>

    <nav class="navbar">
        <div class="nav-item" id="n-ludo" onclick="showPage('ludo-page')">LUDO</div>
        <div class="nav-item" id="n-news" onclick="tryNews()">NEWS</div>
        <div class="nav-item" id="n-live" onclick="showPage('live-page')">LIVE</div>
    </nav>

    <script>
        let myPeer = new Peer(); 
        let dataConn;

        function unlockApp() {
            if(document.getElementById('entry-pin').value === "1234") 
                document.getElementById('main-lock').style.display = 'none';
            else alert("Wrong PIN");
        }

        function tryNews() {
            document.getElementById('news-lock').style.display = 'flex';
        }

        function unlockNews() {
            if(document.getElementById('news-pin').value === "jaan") {
                document.getElementById('news-lock').style.display = 'none';
                showPage('news-page');
            } else alert("Access Denied");
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active-page');
            document.getElementById('news-lock').style.display = 'none';
        }

        async function startCall() {
            const tid = document.getElementById('target-peer').value;
            if(!tid) return;
            const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
            document.getElementById('live-setup').style.display = 'none';
            
            const call = myPeer.call(tid, stream);
            dataConn = myPeer.connect(tid);
            
            call.on('stream', rs => { document.getElementById('v-remote').srcObject = rs; });
            dataConn.on('open', () => {
                dataConn.on('data', d => {
                    appendMsg(d, 'him');
                });
            });
        }

        function broadcast() {
            const msg = document.getElementById('m-text').value;
            if(dataConn && msg) {
                dataConn.send(msg);
                appendMsg(msg, 'me');
                document.getElementById('m-text').value = "";
            }
        }

        function appendMsg(text, type) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerText = text;
            document.getElementById('chat-content').appendChild(div);
            document.getElementById('chat-content').scrollTop = document.getElementById('chat-content').scrollHeight;
        }

        document.body.addEventListener('dblclick', () => showPage('ludo-page'));
    </script>
</body>
</html>
