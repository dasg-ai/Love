<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Gold Premium</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #121212; color: white; overflow: hidden; }
        
        /* Navigation */
        .navbar { height: 60px; background: #1a1a1a; display: flex; justify-content: space-around; align-items: center; position: fixed; bottom: 0; width: 100%; border-top: 1px solid #333; z-index: 100; }
        .nav-item { cursor: pointer; color: #888; font-weight: bold; padding: 10px; }
        .nav-item.active { color: #f1c40f; }

        /* Screens */
        .page { height: calc(100vh - 60px); width: 100%; display: none; position: absolute; top: 0; overflow-y: auto; }
        .page.active { display: block; }

        /* Simple Ludo Board Fix */
        #ludo-page { background: #27ae60; text-align: center; padding-top: 50px; }
        .board { width: 300px; height: 300px; margin: auto; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); border: 10px solid #333; background: white; }
        .box { border: 1px solid #000; display: flex; align-items: center; justify-content: center; }

        /* Chat UI Fix */
        #news-page { background: #fff; color: #000; display: flex; flex-direction: column; }
        #chat-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 8px 12px; border-radius: 10px; max-width: 70%; word-wrap: break-word; }
        .me { background: #dcf8c6; align-self: flex-end; }
        .him { background: #e1e1e1; align-self: flex-start; }
        .chat-input-area { padding: 10px; display: flex; gap: 5px; border-top: 1px solid #ddd; }

        /* Overlays */
        .overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        input { padding: 12px; border-radius: 5px; border: 1px solid #ccc; width: 200px; }
        button { padding: 10px 20px; background: #f1c40f; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="main-lock" class="overlay">
        <h2>LUDO GOLD</h2>
        <input type="password" id="p1" placeholder="Enter Game PIN">
        <br><button onclick="unlockApp()">PLAY</button>
    </div>

    <div id="news-lock" class="overlay" style="display:none;">
        <h2 style="color:red">NEWS PORTAL</h2>
        <input type="password" id="p2" placeholder="Admin Password">
        <br><button onclick="unlockNews()">ACCESS</button>
        <p onclick="goto('ludo-page')" style="color:white; cursor:pointer; margin-top:10px;">← Back</p>
    </div>

    <div id="ludo-page" class="page active">
        <div class="board">
            <div class="box" style="background:red">🔴</div><div class="box"></div><div class="box" style="background:blue">🔵</div>
            <div class="box"></div><div class="box" style="background:yellow">🟡</div><div class="box"></div>
            <div class="box" style="background:green">🟢</div><div class="box"></div><div class="box" style="background:red">🔴</div>
        </div>
        <button onclick="alert('Dice: ' + (Math.floor(Math.random()*6)+1))" style="margin-top:30px;">🎲 ROLL DICE</button>
    </div>

    <div id="news-page" class="page">
        <div style="background:#ed1c24; color:white; padding:15px; font-weight:bold;">Private Messenger</div>
        <div id="chat-window"></div>
        <div class="chat-input-area">
            <input type="text" id="m-val" placeholder="Type here..." style="width:70%">
            <button onclick="send()">Send</button>
        </div>
    </div>

    <div id="live-page" class="page" style="background:black; text-align:center;">
        <div id="setup" style="padding:20px;">
            <h3>Live Settings</h3>
            <input type="text" id="peer-id" placeholder="Partner ID (amit-123)">
            <br><br><button onclick="connectLive()">START LIVE</button>
        </div>
        <video id="vid" autoplay playsinline style="width:100%; height:70%; background:#222;"></video>
    </div>

    <nav class="navbar">
        <div class="nav-item" onclick="goto('ludo-page')">LUDO</div>
        <div class="nav-item" onclick="openNews()">NEWS</div>
        <div class="nav-item" onclick="goto('live-page')">LIVE</div>
    </nav>

    <script>
        let peer = new Peer();
        let connection;

        function unlockApp() {
            if(document.getElementById('p1').value === "1234") 
                document.getElementById('main-lock').style.display = 'none';
            else alert("Ghalat PIN");
        }

        function openNews() {
            document.getElementById('news-lock').style.display = 'flex';
        }

        function unlockNews() {
            if(document.getElementById('p2').value === "jaan") {
                document.getElementById('news-lock').style.display = 'none';
                goto('news-page');
            } else alert("Denied");
        }

        function goto(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('news-lock').style.display = 'none';
        }

        async function connectLive() {
            const tid = document.getElementById('peer-id').value;
            if(!tid) return;
            const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
            document.getElementById('setup').style.display = 'none';
            
            const call = peer.call(tid, stream);
            connection = peer.connect(tid);
            
            call.on('stream', rs => { document.getElementById('vid').srcObject = rs; });
            connection.on('data', d => { addM(d, 'him'); });
        }

        function send() {
            const m = document.getElementById('m-val').value;
            if(connection && m) {
                connection.send(m);
                addM(m, 'me');
                document.getElementById('m-val').value = "";
            } else {
                alert("Pehle LIVE par jaakar connect karo!");
            }
        }

        function addM(t, type) {
            const win = document.getElementById('chat-window');
            win.innerHTML += `<div class="msg ${type}">${t}</div>`;
            win.scrollTop = win.scrollHeight;
        }

        // Security: Double Click se seedha Ludo par
        document.body.addEventListener('dblclick', () => goto('ludo-page'));

        // PeerJS Error check
        peer.on('error', err => { alert("Connection Error: " + err.type); });
    </script>
</body>
</html>
